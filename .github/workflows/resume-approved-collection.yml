name: Inspect and resume approved commander collection

on:
  push:
    branches: [codex/resume-commander-collection-nov11]

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Inspect saved controls and resume when ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STYLE_DISTRIBUTED_RUNNERS: '16'
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          import time

          sys.path.insert(0, "scripts")
          from coordinate_build_styles import GitHub, coordinate, dispatch_collector

          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              raise SystemExit("One-time resume does not repeat on reruns.")
          client = GitHub(os.environ["GITHUB_REPOSITORY"])
          result = coordinate(client, "preflight", now=datetime.now(timezone.utc),
                              current_run_id=int(os.environ["GITHUB_RUN_ID"]))
          summary = result.pop("snapshot", {})
          fields = ("blocked", "blocked_until", "block_reason", "source_stop", "resource_limit",
                    "automatic_continuation_allowed", "continuation_needed", "no_progress", "scope",
                    "remaining_in_batch", "capacity", "deck_rebuild", "official_validation")
          print("::notice::Saved continuation state: " + json.dumps({key: summary[key] for key in fields if key in summary}))
          distributed = summary.get("distributed") or {}
          print("::notice::Distributed status: " + json.dumps({key: distributed[key] for key in
                ("systemic_block", "missing_workers", "invalid_workers", "worker_failures", "runners") if key in distributed}))
          if result.get("run"):
              dispatch_collector(client, result, runners=16)
          elif result.get("reason") == "Source access restriction requires review":
              source_run_id = 42771946303
              ready = coordinate(client, "preflight", now=datetime.now(timezone.utc),
                  current_run_id=int(os.environ["GITHUB_RUN_ID"]), access_review_run_id=source_run_id)
              ready.pop("snapshot", None)
              if not ready.get("run"):
                  raise SystemExit("Access review is not ready: " + json.dumps(ready))
              endpoint = f"{client.root}/actions/workflows/build-commander-styles.yml/runs?per_page=10"
              existing = {run["id"] for run in client.api(endpoint)["workflow_runs"]}
              client.dispatch("build-commander-styles.yml", {"access_review_run_id": str(source_run_id)})
              review_id = None
              for _ in range(20):
                  fresh = [run for run in client.api(endpoint)["workflow_runs"] if run["id"] not in existing
                      and run.get("head_branch") == client.default_branch and run.get("event") == "workflow_dispatch"]
                  if len(fresh) == 1:
                      review_id = fresh[0]["id"]
                      break
                  if len(fresh) > 1:
                      raise SystemExit("Multiple new runs appeared; inspect before choosing a review.")
                  time.sleep(3)
              if review_id is None:
                  raise SystemExit("Review was dispatched but its run ID is not visible yet.")
              print(f"::notice::Access review running: https://github.com/{client.repository}/actions/runs/{review_id}", flush=True)
              deadline = time.monotonic() + 6900
              while time.monotonic() < deadline:
                  run = client.api(f"{client.root}/actions/runs/{review_id}")
                  if run["status"] == "completed":
                      break
                  time.sleep(30)
              else:
                  raise SystemExit("Review is still running; no distributed restart was attempted.")
              if run.get("conclusion") != "success":
                  raise SystemExit("Access review did not succeed; distributed workers remain stopped.")
              with tempfile.TemporaryDirectory(prefix="review-proof-") as directory:
                  client.command(["run", "download", str(review_id), "--repo", client.repository,
                      "--name", f"build-style-summary-{review_id}", "--dir", directory])
                  proof = json.loads((Path(directory) / "access-review.json").read_text())
              if (proof.get("source_run_id") != str(source_run_id) or proof.get("passed") is not True
                      or proof.get("released") is not True or len(proof.get("checks", [])) != 3
                      or any(check.get("status_code") != 200 or check.get("valid") is not True
                             or check.get("challenge") is not False for check in proof["checks"])):
                  raise SystemExit("Ordinary source access was not verified; distributed workers remain stopped.")
              client = GitHub(os.environ["GITHUB_REPOSITORY"])
              reviewed = client.source(review_id)
              if (reviewed is None or not reviewed.durable or reviewed.summary.get("blocked")
                      or reviewed.summary.get("resource_limit")):
                  raise SystemExit("Bounded collection retained a stop; distributed workers remain stopped.")
              result = coordinate(client, "preflight", now=datetime.now(timezone.utc),
                                  current_run_id=int(os.environ["GITHUB_RUN_ID"]))
              result.pop("snapshot", None)
              if result.get("run"):
                  dispatch_collector(client, result, runners=16)
          print("::notice::Resume decision: " + json.dumps(result))
          PY

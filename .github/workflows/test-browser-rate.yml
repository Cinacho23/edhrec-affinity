name: Bounded EDHREC WebKit rate test
run-name: "Measure one browser runner from 0.1 to 1 request per second"

on:
  push:
    branches: [codex/browser-rate-pilot]
    paths:
      - .github/workflows/test-browser-rate.yml
      - scripts/test_browser_rate.py

permissions:
  contents: read
  actions: read

# This explicitly requested one-runner diagnostic measures rates alongside
# unchanged production traffic. Serialize diagnostic copies with each other.
concurrency:
  group: commander-browser-rate-diagnostic
  cancel-in-progress: false

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the diagnostic
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the standard browser
        run: |
          python -m pip install -e '.[collector]'
          python -m playwright install --with-deps webkit
      - name: Check saved controls and run the bounded rate ladder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/test_browser_rate.py --output data/browser-rate-proof
      - name: Retain measurements and any source stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-rate-proof-${{ github.run_id }}
          path: data/browser-rate-proof/
          if-no-files-found: warn
          retention-days: 7

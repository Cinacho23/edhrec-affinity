name: Bounded EDHREC WebKit rate test
run-name: "Measure one browser runner from 1.0 to 5.0 requests per second"

on:
  push:
    branches: [codex/browser-rate-five-pilot]
    paths:
      - .github/workflows/test-browser-rate.yml
      - scripts/test_browser_rate.py
      - scripts/probe_rate_limiter.py
      - scripts/inspect_commander_collection.py

permissions:
  contents: read
  actions: read

concurrency:
  group: commander-browser-rate-diagnostic
  cancel-in-progress: false

jobs:
  progress:
    name: Inspect saved Doctor and Rose collection without source requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Read this commander's owned checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/inspect_commander_collection.py --output data/commander-progress
      - name: Retain the source-free progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commander-progress-${{ github.run_id }}
          path: data/commander-progress/
          retention-days: 7

  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the standard browser
        run: |
          python -m pip install -e '.[collector]'
          python -m playwright install --with-deps webkit
      - name: Check saved controls and run the bounded rate ladder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/test_browser_rate.py --output data/browser-rate-proof
      - name: Retain measurements and any source stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-rate-proof-${{ github.run_id }}
          path: data/browser-rate-proof/
          if-no-files-found: warn
          retention-days: 7

name: Update commander build styles

on:
  workflow_run:
    workflows: ["Update full sharded data and deploy site"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commanders:
        description: "Optional space-separated indexed commander slugs; blank continues the full catalog"
        type: string
        default: ""
      max_commanders:
        description: "Maximum commanders this run; 0 continues the catalog until the time budget"
        type: number
        default: 0
      sample_decks:
        description: "Deck previews per commander: all (default), or an optional count; 0 skips previews"
        type: string
        default: "all"
      max_components:
        description: "Automatic package search: all (default), or an optional positive ceiling"
        type: string
        default: "all"
      refresh:
        description: "Resample selected commanders that already have fitted reports"
        type: boolean
        default: false
      power_only:
        description: "Calculate power for all saved package decks from the cache, then resume normal work"
        type: boolean
        default: false
      validate_power:
        description: "Check saved decks on EDHPowerLevel, repair restriction conflicts, and recheck final lists"
        type: boolean
        default: false
      recovery_run_id:
        description: "Optional interrupted latest run whose summary survived a missing checkpoint upload"
        type: string
        default: ""

permissions:
  contents: read
  # workflow_dispatch is explicitly supported with GITHUB_TOKEN. No PAT or
  # workflow_run recursion is needed for consecutive collection batches.
  actions: write

concurrency:
  group: commander-build-style-samples
  cancel-in-progress: false

env:
  STYLES_DIR: data/build-style-artifact/build-styles
  # One adaptive limiter applies across all collection workers. This is its
  # ceiling, not its startup rate; source blocks stop the entire batch.
  REQUESTS_PER_SECOND: ${{ vars.BUILD_STYLE_REQUESTS_PER_SECOND || '40' }}

jobs:
  preflight:
    name: Check collection readiness without restoring decks
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.ready.outputs.run }}
      restore_run_id: ${{ steps.ready.outputs.restore_run_id }}
      recovery_run_id: ${{ steps.ready.outputs.recovery_run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check active collectors and source cooldown
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          POWER_ONLY: ${{ inputs.power_only }}
          VALIDATE_POWER: ${{ inputs.validate_power }}
        run: |
          args=(preflight --summary-file data/build-style-artifact/build_style_batch.json)
          if [[ -n "${RECOVERY_RUN_ID}" ]]; then
            args+=(--recovery-run-id "${RECOVERY_RUN_ID}")
          fi
          if [[ "${POWER_ONLY}" == "true" || "${VALIDATE_POWER:-false}" == "true" ]]; then
            args+=(--power-only)
          fi
          python3 scripts/coordinate_build_styles.py "${args[@]}"
      - name: Retain a skipped-run summary
        if: steps.ready.outputs.run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-style-summary-${{ github.run_id }}
          path: data/build-style-artifact/build_style_batch.json
          retention-days: 7

  build:
    name: Continue catalog collection and learn build packages
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Each work stage has a bounded shutdown and a shorter shell watchdog.
    # Reserve the rest of the job for restoring and uploading durable progress.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -e ".[prototype]"

      - name: Install the EDHPowerLevel browser
        if: inputs.validate_power == true
        run: |
          python -m pip install -e ".[validation]"
          python -m playwright install --with-deps chromium

      - name: Compute sample date
        shell: bash
        run: echo "SAMPLE_DATE=$(TZ=America/Toronto date +%F)" >> "$GITHUB_ENV"

      - name: Restore accumulated build-style samples
        id: restored_styles
        uses: ./.github/actions/restore-build-styles
        with:
          destination: ${{ env.STYLES_DIR }}
          run-id: ${{ needs.preflight.outputs.restore_run_id }}

      - name: Preserve newer source limits during explicit checkpoint recovery
        if: needs.preflight.outputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ needs.preflight.outputs.recovery_run_id }}
          RESTORED_RUN_ID: ${{ steps.restored_styles.outputs['run-id'] }}
        run: |
          python3 scripts/coordinate_build_styles.py recover-control \
            --recovery-run-id "${RECOVERY_RUN_ID}" --restored-run-id "${RESTORED_RUN_ID}" \
            --state-file "${STYLES_DIR}/_collection/state.json"

      - name: Retain checked repository examples alongside accumulated observations
        run: |
          python scripts/seed_build_style_validations.py \
            --source data/build-styles/validations \
            --destination "${STYLES_DIR}/_collection/external-validations"

      - name: Restore shared card rules cache
        id: card_metadata_cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/build-style-card-metadata.json
          key: build-style-cards-${{ env.SAMPLE_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-style-cards-

      - name: Get current commander index and weekly dataset date
        if: inputs.power_only != true && inputs.validate_power != true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/build-style-artifact
          curl --fail --silent --show-error --retry 2 \
            https://cinacho23.github.io/edhrec-affinity/data/latest/commanders/index.json \
            --output data/build-style-artifact/commander_index.json
          if curl --fail --silent --show-error --retry 2 \
            https://cinacho23.github.io/edhrec-affinity/data/latest/site_manifest.json \
            --output data/build-style-artifact/site_manifest.json; then
            python - <<'PY'
          from datetime import date
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re

          try:
              manifest = json.loads(Path("data/build-style-artifact/site_manifest.json").read_text())
              processed_dir = manifest.get("processed_dir") if isinstance(manifest, dict) else None
              if not isinstance(processed_dir, str):
                  raise ValueError("Missing processed snapshot directory")
              snapshot = PurePosixPath(processed_dir).name
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", snapshot):
                  raise ValueError("Unrecognized processed snapshot date")
              date.fromisoformat(snapshot)
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"DATASET_DATE={snapshot}\n")
              print(f"Using upstream weekly snapshot {snapshot}.")
          except (OSError, ValueError, TypeError):
              print("::warning::No valid upstream snapshot date; preserving the current collection cycle.")
          PY
          else
            echo "::warning::Upstream manifest unavailable; preserving the current collection cycle."
          fi

      - name: Continue the resumable catalog queue
        id: collect_styles
        if: inputs.power_only != true && inputs.validate_power != true
        continue-on-error: true
        timeout-minutes: 36
        shell: bash
        env:
          COMMANDER_SLUGS: ${{ inputs.commanders }}
          MAX_COMMANDERS: ${{ inputs.max_commanders || 0 }}
          SAMPLE_DECKS: ${{ inputs.sample_decks || 'all' }}
          MAX_COMPONENTS: ${{ inputs.max_components || 'all' }}
          REFRESH_REPORTS: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          args=(--fetch --commander-index data/build-style-artifact/commander_index.json
                --output-dir "${STYLES_DIR}" --snapshot-date "${SAMPLE_DATE}"
                --max-commanders "${MAX_COMMANDERS}" --sample-decks "${SAMPLE_DECKS}"
                --max-components "${MAX_COMPONENTS}" --min-total-decks 200
                --main-tag-decks 15 --min-tag-decks 5
                --main-tag-fraction 0.03 --min-tag-fraction 0.01
                --max-runtime-seconds 1800 --worker-grace-seconds 120
                --pipeline --workers 1 --preview-workers 16 --analysis-workers 2
                --requests-per-second "${REQUESTS_PER_SECOND}"
                --source-max-age-hours 72 --refresh-after-days 3
                --freshness-target-hours 96 --prune-completed-cache)
          if [[ -n "${DATASET_DATE:-}" ]]; then
            args+=(--upstream-snapshot-date "${DATASET_DATE}")
          fi
          if [[ -n "${COMMANDER_SLUGS}" ]]; then
            read -r -a commander_args <<< "${COMMANDER_SLUGS}"
            args+=(--commanders "${commander_args[@]}")
          fi
          if [[ "${REFRESH_REPORTS}" == "true" ]]; then
            args+=(--refresh)
          fi
          timeout --signal=INT --kill-after=30s 35m python scripts/build_site_build_styles.py "${args[@]}"

      - name: Report the retained collection checkpoint
        if: steps.collect_styles.outcome == 'failure'
        run: echo "::notice::Collection stopped; reports and the source cooldown are retained. The outcome check distinguishes a rate-limit pause from a failure."

      - name: Prepare saved reports for a power-only pass
        id: prepare_power_only
        if: inputs.power_only == true || inputs.validate_power == true
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_RUN_ID: ${{ steps.restored_styles.outputs['run-id'] }}
        run: |
          python3 scripts/coordinate_build_styles.py prepare-power-only \
            --source-run-id "${RESTORED_RUN_ID}" \
            --summary-file data/build-style-artifact/build_style_batch.json

      - name: Rebuild package decks from saved collections
        id: rebuild_decks
        if: always() && inputs.validate_power != true && (steps.collect_styles.outcome != 'skipped' || steps.prepare_power_only.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 22
        env:
          POWER_ONLY: ${{ inputs.power_only }}
        run: |
          set -euo pipefail
          args=(--build-styles-dir "${STYLES_DIR}"
                --card-metadata-cache data/raw/build-style-card-metadata.json
                --validation-directory "${STYLES_DIR}/_collection/external-validations"
                --workers 2 --only-outdated --current-discovery-only
                --max-runtime-seconds 1200
                --summary data/build-style-artifact/deck-rebuild-summary.json
                --backup-dir "${RUNNER_TEMP}/build-style-deck-backups")
          if [[ "${POWER_ONLY}" == "true" ]]; then
            args+=(--scores-only)
          else
            args+=(--fetch-metadata)
          fi
          timeout --signal=INT --kill-after=30s 21m python scripts/rebuild_generated_decks.py "${args[@]}"

      - name: Check EDHPowerLevel restrictions and repair saved decks
        id: official_validation
        if: inputs.validate_power == true && steps.prepare_power_only.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 33
        env:
          COMMANDER_SLUGS: ${{ inputs.commanders }}
        run: |
          set -euo pipefail
          args=(--build-styles-dir "${STYLES_DIR}"
                --card-metadata-cache data/raw/build-style-card-metadata.json
                --validation-directory "${STYLES_DIR}/_collection/external-validations"
                --max-runtime-seconds 1800 --max-decks 300 --check-interval-seconds 5
                --summary data/build-style-artifact/official-validation-summary.json
                --backup-dir "${RUNNER_TEMP}/official-validation-backups")
          if [[ -n "${COMMANDER_SLUGS}" ]]; then
            read -r -a commander_args <<< "${COMMANDER_SLUGS}"
            for commander_slug in "${commander_args[@]}"; do
              args+=(--commander "${commander_slug}")
            done
          fi
          timeout --signal=INT --kill-after=30s 32m python scripts/validate_generated_decks.py "${args[@]}"

      - name: Save refreshed card rules cache
        id: save_card_metadata
        if: always() && (inputs.power_only != true || inputs.validate_power == true) && steps.card_metadata_cache.outputs.cache-primary-key != '' && hashFiles('data/raw/build-style-card-metadata.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/build-style-card-metadata.json
          key: ${{ steps.card_metadata_cache.outputs.cache-primary-key }}

      - name: Verify saved card rules cache
        id: verify_card_metadata
        if: always() && steps.save_card_metadata.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CARD_METADATA_CACHE_KEY: ${{ steps.card_metadata_cache.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/build-style-card-cache-inventory.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f key="${CARD_METADATA_CACHE_KEY}" -f ref="${GITHUB_REF}" > "${inventory}"
          python3 - "${inventory}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          inventory = json.loads(Path(sys.argv[1]).read_text())
          saved = any(cache.get("key") == os.environ["CARD_METADATA_CACHE_KEY"]
              and cache.get("ref") == os.environ["GITHUB_REF"]
              for cache in inventory.get("actions_caches", []) if isinstance(cache, dict))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"verified={str(saved).lower()}\n")
          if not saved:
              print("::warning::The exact saved metadata cache is not visible yet; metadata-only progress will not trigger immediate continuation.")
          PY

      - name: Include rebuilt decks in publication progress
        if: always() && inputs.validate_power != true && (steps.collect_styles.outcome != 'skipped' || steps.prepare_power_only.outcome == 'success')
        env:
          METADATA_CACHE_SAVED: ${{ steps.verify_card_metadata.outputs.verified == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/build-style-artifact/build_style_batch.json")
          rebuild_path = path.parent / "deck-rebuild-summary.json"
          if not path.exists() or not rebuild_path.exists():
              print("::warning::No deck rebuild summary; keeping the collection outcome and saved reports.")
              raise SystemExit(0)
          summary = json.loads(path.read_text())
          rebuild = json.loads(rebuild_path.read_text())
          summary["deck_rebuild"] = {key: rebuild[key] for key in (
              "generation_version", "regenerated", "pending", "blocked", "changed_deck_lists",
              "scored_reports", "scored_decks", "calculated_decks", "power_refreshed_reports", "scoring_pending",
              "distinctive_omissions_before", "distinctive_omissions_after", "time_budget_reached",
          ) if key in rebuild}
          metadata = rebuild.get("metadata_prefetch") or {}
          metadata_blocked = metadata.get("blocked") is True or metadata.get("status") == "source_access_stopped"
          metadata_saved = os.environ.get("METADATA_CACHE_SAVED") == "true"
          metadata_progress = metadata_saved and (metadata.get("durable_cache_saved") is True
              or type(metadata.get("fetched")) is int and metadata["fetched"] > 0)
          if metadata:
              summary["deck_rebuild"]["metadata_prefetch"] = {key: metadata[key] for key in (
                  "status", "requested", "processed", "resolved", "requests", "fetched", "blocked",
                  "durable_cache_saved",
              ) if key in metadata}
              summary["deck_rebuild"].update(metadata_cache_saved=metadata_saved,
                  durable_metadata_progress=metadata_progress, metadata_source_blocked=metadata_blocked)
          report_progress = any(type(rebuild.get(key)) is int and rebuild[key] > 0
              for key in ("regenerated", "scored_reports", "power_refreshed_reports"))
          if report_progress:
              summary.update(publish_needed=True, no_progress=False)
          elif metadata_progress:
              # Saved metadata is useful progress, but no report has changed.
              # Continue from the remote cache without dispatching publication.
              summary["no_progress"] = False
          if ((report_progress or metadata_progress) and rebuild.get("pending", 0) > 0
                  and not summary.get("blocked") and not metadata_blocked
                  and not summary.get("resource_limit") and summary.get("automatic_continuation_allowed") is True):
              summary["continuation_needed"] = True
          if metadata_blocked:
              summary["continuation_needed"] = False
              print("::warning::Card metadata access stopped; saved progress will not trigger an immediate source retry.")
          if rebuild.get("blocked", 0):
              print(f"::warning::{rebuild['blocked']} saved reports could not be rebuilt; their previous decks were preserved.")
          temporary = path.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(summary, separators=(",", ":")))
          temporary.replace(path)
          PY

      - name: Include EDHPowerLevel checks in publication progress
        if: always() && (steps.collect_styles.outcome != 'skipped' || steps.prepare_power_only.outcome == 'success')
        env:
          VALIDATE_POWER: ${{ inputs.validate_power }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/build-style-artifact/build_style_batch.json")
          current_check = os.environ.get("VALIDATE_POWER") == "true"
          validation_path = (path.parent / "official-validation-summary.json" if current_check else
              Path(os.environ["STYLES_DIR"]) / "_collection/official-validation-summary.json")
          if not path.exists() or not validation_path.exists():
              print("::warning::No completed EDHPowerLevel queue summary; preserving the restored checkpoint.")
              raise SystemExit(0)
          summary = json.loads(path.read_text())
          validation = json.loads(validation_path.read_text())
          summary["power_validation"] = current_check
          summary["official_validation"] = {key: validation[key] for key in (
              "source", "checked", "records_written", "repaired_reports", "changed_reports", "changed_deck_lists",
              "pending", "verified", "unique_lists", "conflicts", "unresolved", "invalid", "source_blocked",
              "source_block_reason", "metadata_source_blocked", "time_budget_reached", "check_limit_reached",
              "continuation_needed", "retry_at", "deferred_checks", "started_at", "completed_at",
          ) if key in validation}
          changed = current_check and type(validation.get("changed_reports")) is int and validation["changed_reports"] > 0
          progress = current_check and (changed or type(validation.get("checked")) is int and validation["checked"] > 0)
          if changed:
              summary["publish_needed"] = True
          if progress:
              summary["no_progress"] = False
          if (current_check and validation.get("continuation_needed") is True and not validation.get("source_blocked")
                  and not validation.get("metadata_source_blocked") and not summary.get("blocked")
                  and not summary.get("resource_limit") and summary.get("automatic_continuation_allowed") is True):
              summary["continuation_needed"] = True
          if current_check and validation.get("source_blocked"):
              summary["continuation_needed"] = False
              print("::warning::EDHPowerLevel access stopped; its queue retains progress and waits for the saved retry time.")
          if validation.get("unresolved"):
              print(f"::warning::{len(validation['unresolved'])} deck checks or repairs need review; existing lists and evidence were retained.")
          temporary = path.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(summary, separators=(",", ":")))
          temporary.replace(path)
          PY

      - name: Upload cumulative build-style samples
        id: checkpoint
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: build-styles-${{ env.SAMPLE_DATE }}-${{ github.run_id }}
          # Raw responses and model scratch can still be pruned while a
          # cancellation finishes. Resume from parsed previews/evidence instead.
          path: |
            ${{ env.STYLES_DIR }}/
            !${{ env.STYLES_DIR }}/_collection/sources/*/previews/**
            !${{ env.STYLES_DIR }}/_collection/analyzed/**
            !${{ env.STYLES_DIR }}/**/*.tmp
          if-no-files-found: warn
          retention-days: 2
          compression-level: 1

      - name: Upload collection summary
        id: collection_summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-style-summary-${{ github.run_id }}
          path: |
            data/build-style-artifact/build_style_batch.json
            data/build-style-artifact/deck-rebuild-summary.json
            data/build-style-artifact/official-validation-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Distinguish a rate-limit pause from a failed collector
        id: collection_status
        if: always() && steps.checkpoint.outcome == 'success'
        run: python3 scripts/coordinate_build_styles.py outcome --summary-file data/build-style-artifact/build_style_batch.json

      - name: Publish the uploaded collector checkpoint
        id: publication
        if: always() && steps.checkpoint.outcome == 'success' && steps.collection_summary.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coordinate_build_styles.py publish --source-run-id "${GITHUB_RUN_ID}"

      - name: Schedule a saved rate-limit cooldown
        id: cooldown
        if: always() && steps.checkpoint.outcome == 'success' && steps.collection_summary.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coordinate_build_styles.py queue-cooldown --source-run-id "${GITHUB_RUN_ID}"

      - name: Decide whether collection can continue immediately
        id: continuation
        if: success() && steps.checkpoint.outcome == 'success' && (steps.collect_styles.outcome == 'success' || steps.prepare_power_only.outcome == 'success')
        shell: bash
        env:
          TARGETED_COMMANDERS: ${{ inputs.commanders }}
          MAX_COMMANDERS: ${{ inputs.max_commanders || 0 }}
          SAMPLE_DECKS: ${{ inputs.sample_decks || 'all' }}
          REFRESH_REPORTS: ${{ inputs.refresh }}
          CURRENT_VALIDATION: ${{ inputs.validate_power }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("data/build-style-artifact/build_style_batch.json")
          summary = json.loads(path.read_text()) if path.exists() else {}
          official = summary.get("official_validation") or {}
          retry_at = official.get("retry_at")
          try:
              retry = datetime.fromisoformat(retry_at.replace("Z", "+00:00")) if retry_at else None
              checks_due = retry is None or retry.tzinfo is not None and retry <= datetime.now(timezone.utc)
          except (ValueError, TypeError, AttributeError):
              checks_due = False
          new_lists = (bool(summary.get("completed"))
              or type((summary.get("deck_rebuild") or {}).get("changed_deck_lists")) is int
                  and summary["deck_rebuild"]["changed_deck_lists"] > 0)
          validate_power = (os.environ.get("CURRENT_VALIDATION") != "true"
              and (type(official.get("pending")) is int and official["pending"] > 0 or new_lists)
              and checks_due and (not official.get("source_blocked") or retry_at)
              and (not official.get("metadata_source_blocked") or retry_at))
          # Explicitly bounded/manual refresh runs stay bounded. An access
          # rate-limit cooldown is resumed separately through a server-side
          # environment timer. No-progress batches wait for the watchdog.
          should_continue = (
              (summary.get("continuation_needed") is True or validate_power and not summary.get("no_progress"))
              and not summary.get("blocked")
              and not summary.get("resource_limit")
              and summary.get("automatic_continuation_allowed") is not False
              and not (summary.get("deck_rebuild") or {}).get("metadata_source_blocked")
              and not summary.get("no_progress")
              and not os.environ.get("TARGETED_COMMANDERS", "").strip()
              and os.environ.get("MAX_COMMANDERS", "0") == "0"
              and os.environ.get("SAMPLE_DECKS", "all") == "all"
              and os.environ.get("REFRESH_REPORTS", "false") != "true"
              and os.environ["GITHUB_REF_NAME"] == os.environ["DEFAULT_BRANCH"]
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"needed={str(should_continue).lower()}\n")
              output.write(f"validate_power={str(should_continue and validate_power).lower()}\n")
          if not should_continue:
              print("No immediate continuation: work is current, bounded, paused, or made no progress.")
          PY

      - name: Continue from the uploaded checkpoint
        if: steps.continuation.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_POWER: ${{ steps.continuation.outputs.validate_power }}
        run: |
          args=(--ref "${DEFAULT_BRANCH}")
          if [[ "${VALIDATE_POWER:-false}" == "true" ]]; then
            args+=(-f validate_power=true)
          fi
          gh workflow run build-commander-styles.yml "${args[@]}"

      - name: Fail the run after preserving collection progress
        if: always() && steps.collect_styles.outcome == 'failure' && steps.collection_status.outputs.status != 'rate_limit_paused'
        run: |
          echo "::error::Collection stopped or failed. Uploaded checkpoints retain progress; inspect the collection summary before retrying."
          exit 1

      - name: Report a frontend publication failure
        if: always() && steps.publication.outcome == 'failure'
        run: |
          echo "::error::Checkpoint was saved, but frontend publication could not be dispatched. Collection continues and the watchdog retries publication."
          exit 1

      - name: Report a cooldown scheduling failure
        if: always() && steps.cooldown.outcome == 'failure'
        run: |
          echo "::error::Checkpoint was saved, but the cooldown waiter could not be dispatched. The watchdog retries scheduling the saved pause."
          exit 1

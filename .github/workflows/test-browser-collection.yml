name: Test EDHREC browser collection
run-name: "Bounded WebKit collection proof"

on:
  workflow_dispatch:

permissions:
  contents: read

# A test is source work too: serialize it with all production collectors.
concurrency:
  group: commander-build-style-samples
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify one gallery and one known 100-card preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_STYLE_EDHREC_TRANSPORT: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the standard WebKit document browser
        run: |
          python -m pip install -e ".[collector]"
          python -m playwright install --with-deps webkit
      - name: Test the production browser transport without changing checkpoints
        run: python scripts/test_browser_collection.py --output data/browser-collection-proof
      - name: Retain bounded proof and diagnostics even when access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collection-proof-${{ github.run_id }}
          path: data/browser-collection-proof/
          if-no-files-found: warn
          retention-days: 7
